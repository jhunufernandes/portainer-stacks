services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:?CLOUDFLARED_IMAGE_TAG is required}
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?CLOUDFLARED_TUNNEL_TOKEN is required}
    networks:
      - cloudflared_network
      - portainer_network
networks:
  cloudflared_network:
    name: cloudflared_network
    driver: bridge
  portainer_network:
    external: true
