services:
  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command:
      - serve
    environment:
      - TZ=${TZ_LOCATION:?TZ_LOCATION is required}
      - NTFY_BASE_URL=${BASE_URL:?BASE_URL is required}
      - NTFY_BEHIND_PROXY=${BEHIND_PROXY:?BEHIND_PROXY is required}
      - NTFY_AUTH_FILE=${AUTH_FILE:?AUTH_FILE is required}
      - NTFY_AUTH_DEFAULT_ACCESS=${AUTH_DEFAULT_ACCESS:?AUTH_DEFAULT_ACCESS is required}
      - NTFY_AUTH_USERS=${AUTH_USERS:?AUTH_USERS is required}
      - NTFY_AUTH_ACCESS=${AUTH_ACCESS:?AUTH_ACCESS is required}
    volumes:
      - ${DATA_LOCATION:?DATA_LOCATION is required}/cache:/var/cache/ntfy
      - ${DATA_LOCATION:?DATA_LOCATION is required}/config:/etc/ntfy
    networks:
      - cloudflared_network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    init: true
networks:
  cloudflared_network:
    external: true
