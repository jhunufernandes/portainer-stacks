services:
  hermes-agent:
    image: nousresearch/hermes-agent:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    volumes:
      - ${HERMES_VOLUME}
    environment:
      - HERMES_DASHBOARD=${HERMES_DASHBOARD}
    networks:
      - cloudflared_network
networks:
  cloudflared_network:
    external: true
