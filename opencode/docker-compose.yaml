services:
  opencode:
    container_name: opencode
    image: ghcr.io/anomalyco/opencode:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    working_dir: /workspace
    environment:
      - TZ=${TZ_LOCATION:?TZ_LOCATION is required}
    volumes:
      - ${DATA_LOCATION:?DATA_LOCATION is required}:/workspace
    networks:
      - cloudflared_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    init: true
networks:
  cloudflared_network:
    external: true
